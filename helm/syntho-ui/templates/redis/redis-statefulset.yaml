{{- if ne (toString .Values.redis.replicaCount) "1" }}
{{- fail "redis.replicaCount must be 1: only a single primary is supported, not Redis HA" }}
{{- end }}
{{- $storageClassName := .Values.redis.storageClassName }}
{{- if ne .Values.redis.persistence.storageClassName nil }}
{{- $storageClassName = .Values.redis.persistence.storageClassName }}
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  labels:
    {{- include "syntho-core.labels" . | nindent 4 }}
    app: redis
spec:
  serviceName: "redis-svc"
  replicas: {{ .Values.redis.replicaCount }}
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      annotations:
        checksum/redis-config: {{ include (print $.Template.BasePath "/redis/redis-config.yaml") . | sha256sum }}
      labels:
        app: redis
    spec:
      initContainers:
      - name: init-redis
        image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
        imagePullPolicy: {{ .Values.redis.image.imagePullPolicy | default "IfNotPresent" }}
        command:
        - bash
        - "-c"
        - |
          set -ex
          # Generate redis server-id from pod ordinal index.
          [[ `hostname` =~ -([0-9]+)$ ]] || exit 1
          ordinal=${BASH_REMATCH[1]}
          # Copy appropriate redis config files from config-map to respective directories.
          if [[ $ordinal -eq 0 ]]; then
            cp /mnt/master.conf /etc/redis-config.conf
          else
            cp /mnt/slave.conf /etc/redis-config.conf
          fi
        volumeMounts:
        - name: redis-claim
          mountPath: /etc
        - name: config-map
          mountPath: /mnt/
      containers:
      - name: redis
        image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
        imagePullPolicy: {{ .Values.redis.image.imagePullPolicy | default "IfNotPresent" }}
        ports:
        - containerPort: 6379
          name: redis
        command:
          - redis-server
          - "/etc/redis-config.conf"
        resources:
          {{- toYaml .Values.redis.resources | nindent 10 }}
        startupProbe:
          exec:
            command: ["sh", "-c", "[ \"$(redis-cli ping)\" = PONG ]"]
          {{- toYaml .Values.redis.startupProbe | nindent 10 }}
        readinessProbe:
          exec:
            command: ["sh", "-c", "[ \"$(redis-cli ping)\" = PONG ]"]
          {{- toYaml .Values.redis.readinessProbe | nindent 10 }}
        livenessProbe:
          exec:
            command: ["sh", "-c", "[ \"$(redis-cli ping)\" = PONG ]"]
          {{- toYaml .Values.redis.livenessProbe | nindent 10 }}
        volumeMounts:
        - name: redis-data
          mountPath: /data
        - name: redis-claim
          mountPath: /etc
      volumes:
      - name: config-map
        configMap:
          name: redis-configuration
      {{- if .Values.nodeSelector }}
      nodeSelector: {{- .Values.nodeSelector | toYaml | nindent 8 }}
      {{- end }}
      {{- if .Values.tolerations }}
      tolerations: {{- .Values.tolerations | toYaml | nindent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity: {{- .Values.affinity | toYaml | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
  - metadata:
      name: redis-claim
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 1Gi
      {{- if and (not $storageClassName) .Values.redis.pvLabelKey }}
      selector:
        matchLabels:
          pv-label-key: {{ .Values.redis.pvLabelKey }}
      {{- else }}
      storageClassName: {{ $storageClassName | default "default" }}
      {{- end }}
  - metadata:
      name: redis-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: {{ .Values.redis.persistence.size }}
      {{- if and (not $storageClassName) .Values.redis.pvLabelKey }}
      selector:
        matchLabels:
          pv-label-key: {{ .Values.redis.pvLabelKey }}
      {{- else }}
      storageClassName: {{ $storageClassName | default "default" }}
      {{- end }}
